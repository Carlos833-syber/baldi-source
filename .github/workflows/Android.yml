name: Build Baldi's Basics in Funkin' - Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.2.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            unzip \
            zip \
            libasound2-dev \
            libpulse-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install Haxe libraries
        run: |
          haxelib install actuate
          haxelib install extension-webm
          haxelib install newgrounds
          haxelib install polymod

          haxelib install hxcpp
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install hscript

      - name: Install project dependencies
        run: |
          if [ -f "haxelib.json" ]; then
            haxelib install haxelib.json
          fi

      - name: Setup Lime
        run: |
          haxelib run lime setup
          haxelib run lime setup android

          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"

      - name: Check environment
        run: |
          echo "===== HAXE ====="
          haxe --version

          echo "===== HAXELIB ====="
          haxelib list

          echo "===== ANDROID SDK ====="
          echo "$ANDROID_SDK_ROOT"

          echo "===== ANDROID NDK ====="
          echo "$ANDROID_NDK_ROOT"

      # ==========================================
      # Corrigido: localizar extension-webm
      # ==========================================
      - name: Locate extension-webm
        shell: bash
        run: |
          WEBM_PATH=$(haxelib path extension-webm \
            | sed 's/^- //' \
            | grep '/extension-webm/' \
            | head -n 1)

          if [ -z "$WEBM_PATH" ]; then
            echo "Não foi possível localizar extension-webm."

            echo "Saída do haxelib:"
            haxelib path extension-webm

            exit 1
          fi

          echo "Extension WebM encontrada:"
          echo "$WEBM_PATH"

          echo "WEBM_PATH=$WEBM_PATH" >> "$GITHUB_ENV"

      # ==========================================
      # Compilar extension-webm
      # ==========================================
      - name: Build extension-webm Android
        shell: bash
        run: |
          echo "Entrando em:"
          echo "$WEBM_PATH"

          cd -- "$WEBM_PATH"

          if [ -f "project.xml" ]; then
            haxelib run lime rebuild android

          elif [ -f "Project.xml" ]; then
            haxelib run lime rebuild android

          else
            echo "ERRO: project.xml não encontrado."

            echo "Arquivos encontrados:"
            find . -maxdepth 5 -type f | sort

            exit 1
          fi

      # ==========================================
      # Verificar biblioteca WebM
      # ==========================================
      - name: Check WebM libraries
        shell: bash
        run: |
          echo "===== BIBLIOTECAS WEBM ====="

          find "$HOME/haxelib/extension-webm" \
            -type f \
            -name "*.so" -o -name "*.a" \
            -print || true

      # ==========================================
      # Limpar build Android
      # ==========================================
      - name: Clean Android
        run: |
          haxelib run lime clean android || true

      # ==========================================
      # Compilar jogo
      # ==========================================
      - name: Build Android APK
        run: |
          haxelib run lime build android -release

      # ==========================================
      # Procurar APK
      # ==========================================
      - name: Find generated APK
        shell: bash
        run: |
          echo "================================"
          echo "PROCURANDO APK"
          echo "================================"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.apk" \
            -print

      # =================================
